spring:
  datasource:
    url: jdbc:h2:mem:agentstudio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

agent-studio:
  version: 1.0.0
  data-dir: target/test-data
  coding:
    workspace-root: target/test-coding-workspace
  embedding:
    provider: local-hash
  vector:
    enabled: false
