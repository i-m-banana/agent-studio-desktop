spring:
  application:
    name: agent-studio-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:23306}/${MYSQL_DATABASE:agent_studio}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:agent_studio}
    password: ${MYSQL_PASSWORD:local-development-only}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 8
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

agent-studio:
  version: 1.0.0
  data-dir: ${AGENT_STUDIO_DATA_DIR:../data}
  coding:
    workspace-root: ${AGENT_STUDIO_CODING_WORKSPACE:../coding-workspace}
    maven-command: ${AGENT_STUDIO_MAVEN_COMMAND:}
    npm-command: ${AGENT_STUDIO_NPM_COMMAND:}
  projects:
    allowed-roots: ${AGENT_STUDIO_PROJECT_ROOTS:}
    protected-roots: ${AGENT_STUDIO_PROTECTED_ROOTS:}
    sandbox-image: ${AGENT_STUDIO_SANDBOX_IMAGE:}
    docker-executable: ${AGENT_STUDIO_DOCKER_EXECUTABLE:}
    mysql-image: ${AGENT_STUDIO_MYSQL_IMAGE:}
  ssh:
    host: ${AGENT_STUDIO_SSH_HOST:}
    port: ${AGENT_STUDIO_SSH_PORT:22}
    username: ${AGENT_STUDIO_SSH_USERNAME:}
    remote-root: ${AGENT_STUDIO_SSH_REMOTE_ROOT:}
    host-key-sha256: ${AGENT_STUDIO_SSH_HOST_KEY_SHA256:}
    password-secret: ${AGENT_STUDIO_SSH_PASSWORD_SECRET:AGENT_STUDIO_SSH_PASSWORD}
    connect-timeout: ${AGENT_STUDIO_SSH_CONNECT_TIMEOUT:10s}
  chat:
    timeout: 120s
  vector:
    enabled: true
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:agent_studio_vector}}
    username: ${POSTGRES_USER:agent_studio}
    password: ${POSTGRES_PASSWORD:local-development-only}
  embedding:
    provider: ${EMBEDDING_PROVIDER:ollama}
    model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    index-version: ${EMBEDDING_INDEX_VERSION:qwen3-0.6b-v1}
    query-instruction: ${EMBEDDING_QUERY_INSTRUCTION:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  retrieval:
    top-k: ${RAG_TOP_K:5}
    score-threshold: ${RAG_SCORE_THRESHOLD:0.05}
  runtime:
    max-tool-rounds: ${AGENT_MAX_TOOL_ROUNDS:4}
    max-tool-calls-per-round: ${AGENT_MAX_TOOL_CALLS_PER_ROUND:4}
    coding-max-tool-rounds: ${AGENT_CODING_MAX_TOOL_ROUNDS:96}
    coding-max-tool-calls-per-round: ${AGENT_CODING_MAX_TOOL_CALLS_PER_ROUND:16}
    coding-timeout: ${AGENT_CODING_RUN_TIMEOUT:1800s}
    model-connect-attempts: ${AGENT_MODEL_CONNECT_ATTEMPTS:3}
    model-connect-retry-delay: ${AGENT_MODEL_CONNECT_RETRY_DELAY:2s}
    approval-timeout: ${AGENT_APPROVAL_TIMEOUT:90s}
    total-timeout: ${AGENT_RUN_TIMEOUT:120s}
    release-candidate-timeout: ${AGENT_RELEASE_CANDIDATE_TIMEOUT:900s}
