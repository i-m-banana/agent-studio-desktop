# Platform-owned synthetic preview. No business application configuration is loaded.
server.port=3000
spring.datasource.url=jdbc:h2:mem:preview;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2,filesystem:/preview/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
# Trusted synthetic data is an afterMigrate callback, after every current H2 migration.
spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
app.upload-dir=/work/uploads
app.jwt-secret=preview-only-never-production-12345678901234567890
app.admin-password=preview-only-admin
app.site-name=\u65f6\u5149\u5f55 \u00b7 \u9694\u79bb\u9884\u89c8
logging.level.root=WARN
